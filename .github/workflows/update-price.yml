name: Update Tin Price

on:
  schedule:
    - cron: '*/5 1-7,13-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install akshare
      - name: Fetch tin price
        run: python scripts/fetch-tin-price.py
      - name: Commit and push
        run: |
          if [[ -n $(git status data/price.json --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/price.json
            git commit -m "auto: 更新沪锡期货行情 $(date +%Y-%m-%d_%H:%M)"
            git push
          else
            echo "No changes to commit"
          fi

      - name: 失败告警（自动开 Issue）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ 行情更新失败 ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `工作流 **${context.workflow}** 运行失败。`,
              ``,
              `- 运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- 触发时间：${new Date().toISOString()}`,
              ``,
              `**排查提示**：优先检查 akshare 接口是否改名（历史案例：futures_zh_realtime → futures_zh_realtime_sina，2026-11-13 起静默失败 6 天）。`
            ].join(String.fromCharCode(10));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
